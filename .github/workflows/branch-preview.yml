name: SullyOS independent development preview

# Isolated publishing repository: this workflow never writes to SullyOS.
# Source: artibala866-cmd/SullyOS at remove-checkphone-vrworld-lifesim.
# Preview rebuild checks both nested legacy order defaults and safely disabled uncertain imports.
on:
  push:
    branches: [main]
  schedule:
    # Off-minute polling reduces the chance of dropped high-load scheduled events.
    # Source pushes cannot directly trigger another repo without an authorized token.
    - cron: '11,26,41,56 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: independent-sullyos-pages
  cancel-in-progress: false

jobs:
  check-source:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      changed: ${{ steps.source.outputs.changed }}
    steps:
      - name: Determine exactly which source commit to publish
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_repo='artibala866-cmd/SullyOS'
          source_branch='remove-checkphone-vrworld-lifesim'
          sha="$(git ls-remote --exit-code "https://github.com/${source_repo}.git" "refs/heads/${source_branch}" | awk '{print $1}')"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Cannot confirm the development branch head; do not deploy.' >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          url='https://artibala866-cmd.github.io/SullyOS-Dev-Preview/preview-source.json'
          published="$(curl -fsSL --max-time 12 "${url}?check=${GITHUB_RUN_ID}" 2>/dev/null | jq -r '(.sourceCommit // "") + ":" + (.brandingVersion // "")' 2>/dev/null || true)"
          if [[ "$published" == "$sha:baby-dog-v1" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already published the latest commit: $sha"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New commit: $sha; published: ${published:-not available}"
          fi

  deploy:
    needs: check-source
    if: needs.check-source.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Checkout exact development commit (read-only)
        uses: actions/checkout@v4
        with:
          repository: artibala866-cmd/SullyOS
          ref: ${{ needs.check-source.outputs.sha }}
          persist-credentials: false

      - name: Checkout test-site-only branding files
        uses: actions/checkout@v4
        with:
          repository: artibala866-cmd/SullyOS-Dev-Preview
          ref: main
          path: .preview-branding
          persist-credentials: false

      - name: Set up Python for icon generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply 宝宝狗 branding to this temporary preview build only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check Pillow==11.3.0
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from PIL import Image

          # Recent source versions already include the final branding and both icon sets.
          # Preserve those assets and cache-busting URLs rather than reapplying the legacy overlay.
          source_html = Path('index.html').read_text(encoding='utf-8')
          if '<title>宝宝狗</title>' in source_html:
              for name in ('manifest.webmanifest', 'manifest-classic.webmanifest'):
                  manifest = json.loads((Path('public') / name).read_text(encoding='utf-8'))
                  if manifest.get('name') != '宝宝狗' or not manifest.get('icons'):
                      raise RuntimeError(f'Incomplete native preview branding: {name}')
                  for icon in manifest['icons']:
                      asset = icon['src'].split('?', 1)[0]
                      if not (Path('public') / asset).is_file():
                          raise RuntimeError(f'Native preview icon missing: {asset}')
              if './icons/baby-dog-180.png' not in source_html or not Path('public/icons/baby-dog-180.png').is_file():
                  raise RuntimeError('Native preview Apple touch icon is missing')
              print('Using the checked-in 宝宝狗 branding and icon sets.')
              raise SystemExit(0)

          image = Image.open('.preview-branding/branding/baby-dog.webp').convert('RGB')
          icon_dir = Path('public/icons')
          icon_dir.mkdir(parents=True, exist_ok=True)
          for side in (180, 192, 512):
              image.resize((side, side), Image.Resampling.LANCZOS).save(
                  icon_dir / f'baby-dog-{side}.png', optimize=True
              )
          maskable = Image.new('RGB', (512, 512), 'white')
          maskable.paste(image.resize((384, 384), Image.Resampling.LANCZOS), (64, 64))
          maskable.save(icon_dir / 'baby-dog-maskable-512.png', optimize=True)

          manifest_path = Path('public/manifest.webmanifest')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest.update(name='宝宝狗', short_name='宝宝狗', id='./')
          manifest['icons'] = [
              dict(src='./icons/baby-dog-192.png?v=1', sizes='192x192', type='image/png'),
              dict(src='./icons/baby-dog-512.png?v=1', sizes='512x512', type='image/png'),
              dict(src='./icons/baby-dog-maskable-512.png?v=1', sizes='512x512',
                   type='image/png', purpose='maskable'),
          ]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
                                   encoding='utf-8')

          html_path = Path('index.html')
          html = html_path.read_text(encoding='utf-8')
          for before, after in [
              ('<title>SullyOS·糯米机</title>', '<title>宝宝狗</title>'),
              ('content="SullyOS·糯米机"', 'content="宝宝狗"'),
          ]:
              if before not in html:
                  raise RuntimeError(f'Expected branding source not found: {before}')
              html = html.replace(before, after)
          html, n1 = re.subn(
              r'(<link rel="icon" type="image/png" href=")[^"]+(")',
              r'\g<1>./icons/baby-dog-192.png?v=1\g<2>', html, count=1
          )
          html, n2 = re.subn(
              r'(<link rel="apple-touch-icon" sizes="180x180" href=")[^"]+(")',
              r'\g<1>./icons/baby-dog-180.png?v=1\g<2>', html, count=1
          )
          if (n1, n2) != (1, 1):
              raise RuntimeError('Icon HTML tags changed; refuse incomplete branding')
          html_path.write_text(html, encoding='utf-8')
          print('Preview-only 宝宝狗 name and PNG icons are ready.')
          PY

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify complete Neural Link character deletion
        run: pnpm exec vitest run utils/deletedRoleResidue.test.ts utils/amsg2CharCleanup.test.ts

      - name: Check character deletion TypeScript diagnostics
        shell: bash
        run: |
          pnpm exec tsc --noEmit --pretty false > /tmp/character-deletion-tsc.log 2>&1 || true
          grep -E '^(utils/(characterDeletionCascade|db|deletedRoleResidue)(\\.test)?\\.ts|context/OSContext\\.tsx|apps/Character\\.tsx)[(]' /tmp/character-deletion-tsc.log > /tmp/character-deletion-errors.log || true
          if [ -s /tmp/character-deletion-errors.log ]; then
            cat /tmp/character-deletion-errors.log
            exit 1
          fi

      - name: Verify Halloween annex is reachable and preserves saved rooms
        run: pnpm exec vitest run apps/room3d/halloweenActivity.test.js utils/room3dHalloweenActivityRoom.test.ts

      # Voice audit: forwarded voice remains playable through a shared BlobRef, while model prompts receive transcript only.
      # Voice audit: prevent silent STT hangs, preserve edited recordings, verify forwarding text and themed playback.
      # Private-chat voice checks real spoken-text recognition, keyboard IME
      # dictation fallback, compact composer, and original voice-bar parity.
      # This release must not advertise raw audio as auto-transcribed.
      # Private-chat voice regression also guards the compact inline microphone,
      # wide composer and stacked two-mode chooser (without a second outer column).
      # It also verifies sent voice reuses the original Char bar appearance.
      - name: Verify private chat voice UI parity, history and Android-safe fallback before publication
        run: pnpm exec vitest run utils/userVoiceMessage.test.ts utils/userVoiceAudio.test.ts utils/privateChatRecording.test.ts utils/userVoiceMessage.wiring.test.ts utils/chatAutoReply.test.ts utils/chatKeyboardViewport.test.ts utils/emojiImport.test.ts utils/emojiImportRealScenarios.test.ts utils/emojiDocumentImport.test.ts utils/emojiDocumentPicker.test.ts utils/pdfText.test.ts utils/chatInputEmojis.test.ts

      - name: Test memory palace summary error propagation and API reply compatibility
        run: pnpm exec vitest run utils/memoryPalace/extractionFeatureFlag.test.ts

      - name: Verify imported SillyTavern presets before publishing
        run: pnpm exec vitest run utils/storyTheaterHtml.test.ts utils/storyTheaterHtmlUI.test.tsx utils/storyTheaterClockIsolation.test.tsx utils/storyTheaterRealDialectAudit.test.ts utils/storyTavernCategories.test.ts utils/storySillyTavernImport.test.ts utils/storyTavernAuthorSections.test.ts utils/storyQuickPresetPanel.test.tsx utils/storyPresetImportAudit.test.ts utils/storyPresetImportUi.test.tsx utils/storyTheater.test.ts utils/storyReadingScroll.wiring.test.ts utils/storyTheaterReply.test.ts utils/storyOpeningDocumentImport.test.ts utils/storyImportExperience.wiring.test.ts

      - name: Check story import TypeScript diagnostics
        shell: bash
        run: |
          pnpm exec tsc --noEmit --pretty false > /tmp/story-import-tsc.log 2>&1 || true
          grep -E '^(utils/storySillyTavernImport(\\.test)?\\.ts|utils/storyTheater\\.ts|components/date/story/(StoryTheater|StoryTheaterEditor)\\.tsx|types\\.ts)[(]' /tmp/story-import-tsc.log > /tmp/story-import-errors.log || true
          if [ -s /tmp/story-import-errors.log ]; then
            cat /tmp/story-import-errors.log
            exit 1
          fi
          echo 'Story preset importer TypeScript diagnostics clean.'

      - name: Install Chinese fonts for accurate text snapshots
        shell: bash
        run: |
          set -euo pipefail
          # The preview must not stop publishing when Ubuntu's temporary APT
          # mirror is down. Prefer the CJK font already present on the runner.
          if [ -n "$(fc-list :lang=zh family | head -n 1)" ]; then
            echo 'Using preinstalled Chinese font.'
          elif timeout 8s getent hosts security.ubuntu.com >/dev/null 2>&1; then
            if ! timeout 75s sudo apt-get update -qq ||
               ! timeout 75s sudo apt-get install -y -qq fonts-noto-cjk; then
              echo '::warning::Ubuntu font mirror unavailable. Proceeding with system font fallback.'
            fi
          else
            echo '::warning::Ubuntu font mirror DNS unavailable. Proceeding with system font fallback.'
          fi
          fc-list :lang=zh family | head -n 5 || true

      - name: Capture real JournalApp index layout on mobile
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vite --host 127.0.0.1 --port 5182 --strictPort > /tmp/journal-index-vite.log 2>&1 &
          server_pid="$!"
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5182/tests/journal-index-visual.html > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/journal-index-vite.log; exit 1; fi
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node scripts/journal-index-visual.mjs || {
            tail -n 120 /tmp/journal-index-vite.log || true
            exit 1
          }

      - name: Upload real JournalApp mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-index-real-component-mobile
          path: /tmp/journal-index-shots/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Check and capture original Worldbook mobile UI
        # Preserve a visible diagnostic, but do not block an unrelated story-preset preview when this 92-item screenshot stress fixture times out.
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vite --host 127.0.0.1 --port 5182 --strictPort > /tmp/worldbook-bulk-vite.log 2>&1 &
          server_pid="$!"
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5182/test/fixtures/worldbook-bulk-visual.html > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/worldbook-bulk-vite.log; exit 1; fi
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node scripts/worldbook-bulk-visual.mjs || {
            echo '--- Worldbook Vite diagnostics ---'
            tail -n 100 /tmp/worldbook-bulk-vite.log || true
            exit 1
          }

      - name: Upload Worldbook search and multiselect screenshots
        uses: actions/upload-artifact@v4
        with:
          name: worldbook-mobile-search-selection
          path: /tmp/worldbook-bulk-shots/*.png
          retention-days: 7

      - name: Capture real story session mobile screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/story-mobile-shots
          pnpm exec vite --host 127.0.0.1 --port 5178 --strictPort > /tmp/story-mobile-vite.log 2>&1 &
          server_pid="$!"
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5178/story-reading-scroll-visual.html > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/story-mobile-vite.log; exit 1; fi
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          for item in "novel:top" "novel:middle" "novel:latest" "dark:middle"; do
            mode="${item%%:*}"
            focus="${item##*:}"
            "$browser" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --no-first-run \
              --window-size=390,844 --virtual-time-budget=6500 \
              --screenshot="/tmp/story-mobile-shots/story-${mode}-${focus}.png" \
              "http://127.0.0.1:5178/story-reading-scroll-visual.html?mode=${mode}&focus=${focus}"
          done
          "$browser" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --no-first-run \
            --window-size=390,844 --virtual-time-budget=11000 \
            --screenshot="/tmp/story-mobile-shots/story-novel-120-floors.png" \
            "http://127.0.0.1:5178/story-reading-scroll-visual.html?mode=novel&focus=middle&count=120"
          test "$(find /tmp/story-mobile-shots -name '*.png' | wc -l)" -eq 5
          "$browser" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --no-first-run \
            --window-size=390,844 --virtual-time-budget=11000 --dump-dom \
            "http://127.0.0.1:5178/story-reading-scroll-visual.html?mode=novel&focus=middle&count=120" > /tmp/story-reading-120-floors.html
          grep -q 'data-story-scroll-ready="true"' /tmp/story-reading-120-floors.html || {
            echo 'Long running 120-floor story scroll failed'
            grep -o '<output[^>]*>[^<]*</output>' /tmp/story-reading-120-floors.html || true
            exit 1
          }
          grep -q 'data-story-floor="120"' /tmp/story-reading-120-floors.html
          for item in "novel:top" "novel:middle" "novel:latest" "dark:middle"; do
            mode="${item%%:*}"
            focus="${item##*:}"
            "$browser" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --no-first-run \
              --window-size=390,844 --virtual-time-budget=6500 --dump-dom \
              "http://127.0.0.1:5178/story-reading-scroll-visual.html?mode=${mode}&focus=${focus}" > "/tmp/story-reading-${mode}-${focus}.html"
            grep -q 'data-story-scroll-ready="true"' "/tmp/story-reading-${mode}-${focus}.html" || {
              echo "Real-component visual audit failed: ${item}"
              grep -o '<output[^>]*>[^<]*</output>' "/tmp/story-reading-${mode}-${focus}.html" || true
              exit 1
            }
            grep -q 'data-story-floor="26"' "/tmp/story-reading-${mode}-${focus}.html"
          done
      - name: Exercise imported story setup in real mobile browser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/story-import-ux-shots
          pnpm exec vite --host 127.0.0.1 --port 5179 --strictPort > /tmp/story-import-vite.log 2>&1 &
          pid="$!"
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5179/story-import-ux-visual.html > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/story-import-vite.log; exit 1; fi
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          for focus in search preset single; do
            "$browser" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --no-first-run \
              --window-size=390,844 --virtual-time-budget=30000 \
              --dump-dom "http://127.0.0.1:5179/story-import-ux-visual.html?focus=${focus}" > "/tmp/story-import-ux-${focus}.html"
            grep -q 'data-story-import-ux-ready="true"' "/tmp/story-import-ux-${focus}.html" || {
              echo "Import UX failed: ${focus}"
              grep -o '<output[^>]*>[^<]*</output>' "/tmp/story-import-ux-${focus}.html" || true
              grep -o 'data-story-import-ux-error="[^"]*"' "/tmp/story-import-ux-${focus}.html" || true
              grep -o 'data-story-import-ux-stage="[^"]*"' "/tmp/story-import-ux-${focus}.html" || true
              grep -o '<vite-error-overlay[^>]*>' "/tmp/story-import-ux-${focus}.html" || true
              echo '--- browser DOM tail ---'
              tail -c 2500 "/tmp/story-import-ux-${focus}.html" || true
              echo '--- Vite error log ---'
              tail -n 80 /tmp/story-import-vite.log || true
              exit 1
            }
            "$browser" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --no-first-run \
              --window-size=390,844 --virtual-time-budget=30000 \
              --screenshot="/tmp/story-import-ux-shots/import-${focus}.png" \
              "http://127.0.0.1:5179/story-import-ux-visual.html?focus=${focus}"
          done
      - name: Upload story import UX screenshots
        uses: actions/upload-artifact@v4
        with:
          name: story-import-ux-mobile
          path: /tmp/story-import-ux-shots/*.png
          retention-days: 5

      - name: Check original preset text inspector and exact return on mobile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/story-preset-ux-shots
          pnpm exec vite --host 127.0.0.1 --port 5184 --strictPort > /tmp/story-preset-ux-vite.log 2>&1 &
          pid="$!"
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5184/test/fixtures/story-preset-import-audit.html > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/story-preset-ux-vite.log; exit 1; fi
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          for focus in inspect returned; do
            url="http://127.0.0.1:5184/test/fixtures/story-preset-import-audit.html?dialect=unseen&theme=light&focus=${focus}"
            "$browser" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --no-first-run \
              --window-size=390,844 --virtual-time-budget=23000 --dump-dom "$url" > "/tmp/story-preset-${focus}.html"
            grep -q 'data-story-preset-audit-ready="true"' "/tmp/story-preset-${focus}.html" || {
              echo "Preset source inspection failed: ${focus}"
              grep -o '<output[^>]*>[^<]*</output>' "/tmp/story-preset-${focus}.html" || true
              tail -n 60 /tmp/story-preset-ux-vite.log || true
              exit 1
            }
            "$browser" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --no-first-run \
              --window-size=390,844 --virtual-time-budget=23000 \
              --screenshot="/tmp/story-preset-ux-shots/preset-${focus}.png" "$url"
          done
      - name: Upload preset original-text and return-position mobile screenshots
        uses: actions/upload-artifact@v4
        with:
          name: story-preset-ux-mobile
          path: /tmp/story-preset-ux-shots/*.png
          retention-days: 5

      - name: Upload real story reading screenshots
        uses: actions/upload-artifact@v4
        with:
          name: story-reading-mobile-screenshots
          path: /tmp/story-mobile-shots/*.png
          retention-days: 5

      - name: Build Vite site for GitHub Pages
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.check-source.outputs.sha }}
        run: |
          set -euo pipefail
          # The runner belongs to the preview/main branch; override metadata
          # so the Vite bundle identifies the ACTUAL SullyOS source branch.
          env -u GITHUB_REF_NAME -u GITHUB_SHA \
            CF_PAGES_BRANCH='remove-checkphone-vrworld-lifesim' \
            CF_PAGES_COMMIT_SHA="$SOURCE_SHA" \
            GITHUB_PAGES='1' \
            pnpm run build

      - name: Add verifiable source-revision marker
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.check-source.outputs.sha }}
        run: |
          set -euo pipefail
          jq -n \
            --arg repository 'artibala866-cmd/SullyOS' \
            --arg branch 'remove-checkphone-vrworld-lifesim' \
            --arg sha "$SOURCE_SHA" \
            --arg builtAt "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            '{sourceRepository:$repository,sourceBranch:$branch,sourceCommit:$sha,builtAt:$builtAt,brandingVersion:"baby-dog-v1"}' \
            > dist/preview-source.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload preview build
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy the isolated GitHub Pages site
        id: publish
        uses: actions/deploy-pages@v4

      - name: Verify the PUBLIC test-site source revision
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.check-source.outputs.sha }}
        run: |
          set -euo pipefail
          url='https://artibala866-cmd.github.io/SullyOS-Dev-Preview/preview-source.json'
          for attempt in $(seq 1 24); do
            observed="$(curl -fsSL --max-time 15 "${url}?verify=${GITHUB_RUN_ID}-${attempt}" 2>/dev/null | jq -r '.sourceCommit // ""' 2>/dev/null || true)"
            if [[ "$observed" == "$SOURCE_SHA" ]]; then
              echo "Verified public test site has source commit $SOURCE_SHA"
              exit 0
            fi
            echo "Propagation check $attempt/24: observed ${observed:-unavailable}, expected $SOURCE_SHA"
            sleep 5
          done
          echo "Test site did not expose the expected source commit; refusing to report a successful verified release." >&2
          exit 1
